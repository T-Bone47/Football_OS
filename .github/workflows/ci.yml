# Config reviewed but NOT executed in the remediation sandbox (no runner, no network). Verify on first push.
name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fios
          POSTGRES_PASSWORD: fios
          POSTGRES_DB: fios_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://fios:fios@localhost:5432/fios_test
      TEST_DATABASE_URL: postgresql+asyncpg://fios:fios@localhost:5432/fios_test
      AUTH_JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: "Static ORM vs migration parity (no database needed)"
        run: python tools/check_orm_migration_parity.py
      - name: Migrate an empty database
        run: alembic upgrade head
      - name: "ORM vs migration drift check (fails if models differ from the migrated schema)"
        run: alembic check
      - name: "Tests (clean checkout; data/bronze is not present or required)"
        run: pytest -v
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Football_OS-frontend/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: Football_OS-frontend/frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn build
        env:
          CI: "false"   # the CRA/craco default treats warnings as errors; track warnings separately
