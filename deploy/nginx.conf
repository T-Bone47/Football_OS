# Gateway: ONE origin for the browser, TWO backends. Ownership is decided in docs/ADR-0004-backend-ownership-and-gateway.md
# and enforced by tests/unit/test_gateway_ownership.py (no URL is served by both services; every frontend path exists).
#
#   /api/auth/*        identity service  (Google sign-in, sessions, short-lived access tokens)  -> MongoDB
#   /api/shortlists*   identity service  (per-user shortlists)                                  -> MongoDB
#   /api/*  (the rest) analytics API     (apps/api)                                             -> PostgreSQL
#
# Not verified in the audit sandbox (no nginx/Docker): run `nginx -t` and a smoke test before relying on it.
upstream identity { server identity:8001; }
upstream api      { server api:8000; }

server {
    listen 80;
    client_max_body_size 5m;

    location /api/auth/ {
        proxy_pass http://identity;
        include /etc/nginx/proxy_params;
    }

    location /api/shortlists {
        proxy_pass http://identity;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        proxy_pass http://api;
        include /etc/nginx/proxy_params;
        proxy_buffering off;   # server-sent events (copilot) must not be buffered
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
