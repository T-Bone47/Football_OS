# Target shape per architecture doc §5/§47. NOT executed in the sandbox this
# was authored in (no Docker there) — verify with `docker compose up` in a
# real dev environment before relying on it.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fios
      POSTGRES_PASSWORD: fios
      POSTGRES_DB: fios
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fios
      MINIO_ROOT_PASSWORD: fios12345
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    depends_on: [postgres, redis, minio]
    ports: ["8000:8000"]

volumes:
  pgdata:
  miniodata:
